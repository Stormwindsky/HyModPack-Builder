<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyModPack Builder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --hytale-orange: #ff9d00;
            --hytale-dark: #1a1a1a;
            --hytale-gray: #2d2d2d;
            --text-light: #f0f0f0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--hytale-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--hytale-gray);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid rgba(255, 157, 0, 0.3);
        }

        h1 { 
            color: var(--hytale-orange); 
            margin-top: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p { color: #aaa; font-size: 0.95rem; }

        input {
            width: 100%;
            padding: 14px;
            margin: 20px 0;
            border-radius: 6px;
            border: 1px solid #444;
            box-sizing: border-box;
            background: #111;
            color: white;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--hytale-orange);
        }

        button {
            background-color: var(--hytale-orange);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            width: 100%;
            transition: all 0.2s ease;
            margin-bottom: 10px;
        }

        button:hover { 
            background-color: #e68a00; 
            box-shadow: 0 0 15px rgba(255, 157, 0, 0.4);
        }

        button:disabled { 
            background-color: #555; 
            cursor: not-allowed; 
            box-shadow: none;
        }

        .secondary-btn {
            background-color: transparent;
            border: 1px solid var(--hytale-orange);
            margin-top: 5px;
        }

        .secondary-btn:hover {
            background-color: rgba(255, 157, 0, 0.1);
        }

        #status-container {
            margin-top: 25px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            min-height: 20px;
        }

        #statusText {
            font-size: 0.9rem;
            color: #bbb;
        }

        .loader {
            border: 3px solid #333;
            border-top: 3px solid var(--hytale-orange);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
            display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h1>HyModPack Builder</h1>
    <p>Enter the URL of your <strong>.hymp</strong> instruction file</p>
    
    <input type="text" id="hympUrl" placeholder="https://example.com/pack.hymp" spellcheck="false">
    
    <button id="startBtn">Build ModPack</button>
    <button id="listBtn" class="secondary-btn">View Pack List</button>

    <div id="status-container">
        <div id="loader" class="loader"></div>
        <span id="statusText">Waiting for URL...</span>
    </div>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const listBtn = document.getElementById('listBtn');
    const statusText = document.getElementById('statusText');
    const loader = document.getElementById('loader');

    listBtn.addEventListener('click', () => {
        window.open('https://stormwindsky.github.io/HyModPack-Builder/List', '_blank');
    });

    startBtn.addEventListener('click', async () => {
        const url = document.getElementById('hympUrl').value.trim();
        
        if (!url) {
            updateStatus(false, "Please provide a valid URL.");
            return;
        }

        updateStatus(true, "Fetching .hymp file...");

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error("Could not fetch the .hymp file.");
            
            const config = await response.json();
            const zip = new JSZip();
            
            // Ensures the 'mods' folder exists inside the zip even if empty
            zip.folder("mods");

            updateStatus(true, "Processing preview.png...");
            if (config.previewUrl) {
                try {
                    const previewResp = await fetch(config.previewUrl);
                    if (previewResp.ok) {
                        const previewBlob = await previewResp.blob();
                        const processedImageBlob = await processAndResizeImage(previewBlob, 640, 360);
                        zip.file("preview.png", processedImageBlob);
                    }
                } catch (e) {
                    console.warn("Failed to download or process preview.png", e);
                }
            }

            if (config.mods && Array.isArray(config.mods)) {
                for (let i = 0; i < config.mods.length; i++) {
                    const modUrl = config.mods[i];
                    const fileName = modUrl.split('/').pop() || `mod_${i}.jar`;
                    
                    updateStatus(true, `Downloading mod: ${fileName}...`);
                    
                    try {
                        const modResp = await fetch(modUrl);
                        if (modResp.ok) {
                            const modBlob = await modResp.blob();
                            zip.file(`mods/${fileName}`, modBlob);
                        }
                    } catch (e) {
                        console.warn(`Failed to download mod: ${fileName}`);
                    }
                }
            }

            // Prompt user for custom zip file name
            const defaultZipName = config.zipName || config.folderName || "ModPack";
            let customZipName = prompt("Enter a name for your .zip file:", defaultZipName);
            
            if (customZipName === null) {
                updateStatus(false, "Build canceled by user.");
                return;
            }

            customZipName = customZipName.trim();
            if (!customZipName) {
                customZipName = defaultZipName;
            }

            if (!customZipName.endsWith('.zip')) {
                customZipName += '.zip';
            }

            updateStatus(true, "Packaging your files...");
            const content = await zip.generateAsync({type: "blob"});
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = customZipName;
            link.click();

            updateStatus(false, "Success! Your ModPack is ready.");

        } catch (error) {
            console.error(error);
            updateStatus(false, "Error: Check URL or CORS policy.");
        }
    });

    function processAndResizeImage(blob, targetWidth, targetHeight) {
        return new Promise((resolve) => {
            const img = new Image();
            const url = URL.createObjectURL(blob);

            img.onload = () => {
                URL.revokeObjectURL(url);
                
                // If dimensions match target exactly, return original blob
                if (img.width === targetWidth && img.height === targetHeight) {
                    resolve(blob);
                    return;
                }

                // Resize image using HTML Canvas
                const canvas = document.createElement('canvas');
                canvas.width = targetWidth;
                canvas.height = targetHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

                canvas.toBlob((resizedBlob) => {
                    resolve(resizedBlob);
                }, 'image/png');
            };

            img.onerror = () => {
                URL.revokeObjectURL(url);
                resolve(blob);
            };

            img.src = url;
        });
    }

    function updateStatus(isLoading, text) {
        statusText.innerText = text;
        loader.style.display = isLoading ? "inline-block" : "none";
        startBtn.disabled = isLoading;
        listBtn.disabled = isLoading;
    }
</script>

</body>
</html>
